[project]
name = "presence-demo"
version = "0.11.2"
description = "Detect when conversing users leave: audio VAD + face tracking fusion, with a live web demo"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "presence-demo contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "opencv-python-headless>=4.8,<5",
    "numpy>=1.24",
    "psutil>=5.9",
    "ai-edge-litert>=2.3.0",
]

[project.optional-dependencies]
# PureSound streaming voice isolation (audio_pipeline=puresound), public repo github.com/mcw519/puresound.
puresound = ["puresound-streaming[cpu]; python_version >= '3.12'"]

[project.scripts]
presence-demo = "presence_demo.server:main"

[dependency-groups]
dev = ["pytest>=7", "httpx>=0.27", "ruff>=0.6", "websockets>=12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["presence_demo"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E702", "E701", "UP031"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702", "B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv.sources]
puresound-streaming = { git = "https://github.com/mcw519/puresound.git", subdirectory = "sdk/python", rev = "121bf623b491cb7f18805bec65099543ecc5323f" }
